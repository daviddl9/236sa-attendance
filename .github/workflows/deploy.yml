name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"

      - name: Build backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o backend/main ./backend/cmd/api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          VITE_API_URL=https://attendance.236sa.one npx vite build

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          rsync -avz backend/main $USER@$HOST:/opt/apps/attendance/backend/
          rsync -avz backend/migrations $USER@$HOST:/opt/apps/attendance/backend/
          rsync -avz --delete frontend/dist/ $USER@$HOST:/opt/apps/attendance/frontend/dist/
          ssh $USER@$HOST "cd /opt/apps && docker compose restart attendance-api"
